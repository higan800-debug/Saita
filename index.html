<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя ♥</title>
<style>
  :root{--pink:#ff4d8d;--glass:rgba(255,255,255,.07);--border:rgba(255,255,255,.15);--text:#f5eaf2;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#0a0510;overflow:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60vmax 60vmax at 15% 20%,rgba(255,77,141,.28),transparent 60%),radial-gradient(55vmax 55vmax at 85% 80%,rgba(120,60,255,.28),transparent 60%),radial-gradient(40vmax 40vmax at 60% 10%,rgba(255,140,80,.12),transparent 60%),#0a0510;animation:drift 14s ease-in-out infinite alternate}
  @keyframes drift{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(25deg)}}
  #hearts{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .fall{position:absolute;top:-10vh;animation:fall linear forwards;user-select:none;will-change:transform}
  @keyframes fall{to{transform:translate3d(var(--dx),115vh,0) rotate(var(--rot));opacity:.9}}
  .screen{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;transition:opacity .9s ease,transform .9s ease,visibility .9s}
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.96)}
  .card{width:100%;max-width:420px;padding:40px 28px;text-align:center;background:var(--glass);border:1px solid var(--border);border-radius:28px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);margin:auto}
  .lock{font-size:44px;margin-bottom:14px;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{font-size:clamp(24px,6vw,30px);font-weight:700;margin-bottom:8px;letter-spacing:.3px}
  .sub{font-size:15px;opacity:.7;margin-bottom:26px;line-height:1.5}
  input{width:100%;padding:16px 18px;font-size:22px;text-align:center;letter-spacing:10px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;outline:none;transition:border-color .3s,box-shadow .3s}
  input::placeholder{letter-spacing:4px;opacity:.35}
  input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,77,141,.18)}
  .btn{margin-top:16px;width:100%;padding:16px;font-size:17px;font-weight:600;color:#fff;cursor:pointer;border:none;border-radius:16px;background:linear-gradient(135deg,#ff4d8d,#c13cff);box-shadow:0 10px 30px rgba(255,77,141,.35);transition-property:scale,box-shadow;transition-duration:.15s,.3s;transition-timing-function:ease-out}
  @media (hover:hover){.btn:hover{box-shadow:0 14px 38px rgba(255,77,141,.5)}}
  .btn:not(:disabled):active{scale:.96}
  .error{min-height:22px;margin-top:14px;font-size:14px;color:#ff9fbd;opacity:0;transition:opacity .4s}
  .error.show{opacity:1}
  .shake{animation:shake .5s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .heart{font-size:68px;display:inline-block;cursor:pointer;animation:beat 1.3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,77,141,.8))}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  .love h1{margin:14px 0 14px;background:linear-gradient(90deg,#ffb3d1,#ff4d8d,#d9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #phrase{font-size:17px;line-height:1.65;min-height:112px;display:flex;align-items:center;justify-content:center;transition:opacity .35s,transform .35s}
  #phrase.out{opacity:0;transform:translateY(8px)}
  .counter{font-size:13px;opacity:.5;margin-top:10px}
  .sign{margin-top:14px;font-size:15px;opacity:.85;font-style:italic}
  .love>:nth-child(2){--i:0}.love>:nth-child(3){--i:1}.love>:nth-child(4){--i:2}.love>:nth-child(5){--i:3}.love>:nth-child(6){--i:4}.love>:nth-child(7){--i:5}
  @keyframes enter{from{opacity:0;filter:blur(4px);transform:translateY(12px)}}
  @media (prefers-reduced-motion:no-preference){
    #surprise:not(.hidden) .love>:not(.heart){animation:enter .3s ease-out backwards;animation-delay:calc(var(--i)*100ms + 250ms)}
  }
  @media (prefers-reduced-motion:reduce){
    .bg,.lock,.heart,.shake{animation:none}
    .screen.hidden{transform:none}
    .screen{transition-property:opacity,visibility}
  }
  .btn.alt{background:var(--glass);border:1px solid var(--border);box-shadow:none;margin-top:12px}
  .pop{position:fixed;z-index:50;pointer-events:none;user-select:none;will-change:transform,opacity}
</style>
</head>
<body>
<div class="bg"></div>
<div id="hearts"></div>

<section class="screen" id="login">
  <div class="card" id="loginCard">
    <div class="lock">🔒</div>
    <h1>Фатима, тут кое-что для тебя</h1>
    <p class="sub">Введи пароль, чтобы открыть сюрприз</p>
    <input id="pass" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <button class="btn" id="enter">Войти</button>
    <div class="error" id="err">Ой, не то 🥺 Попробуй ещё раз</div>
  </div>
</section>

<section class="screen hidden" id="surprise">
  <div class="card love">
    <div class="heart" id="bigHeart">❤️</div>
    <h1>Фатима, я тебя люблю</h1>
    <p id="phrase"></p>
    <button class="btn" id="next">Ещё одно признание 💌</button>
    <button class="btn alt" id="boom">Нажми на меня 🎉</button>
    <div class="counter" id="counter"></div>
    <div class="sign">С любовью, твой Ильяс 💕</div>
  </div>
</section>

<script>
  const PASSWORD = "2731";
  const phrases = [

    "Рядом с тобой я чувствую себя дома, где бы мы ни были.",

    "Ты — моё сердце, которое ходит отдельно от меня.",

    "Я люблю тебя, Фатима. Сегодня, завтра и всегда.",
    "И это только часть. Остальные слова я скажу тебе лично.",
    "Ты — самое лучшее, что случилось со мной. Рядом с тобой мир становится теплее и ярче.",
    "Мне не нужны слова, чтобы это сказать, но всё равно скажу: ты моя любимая.",
    "Каждый день с тобой — как маленький праздник. Спасибо, что ты есть.",
    "Твоя улыбка — моя любимая причина улыбаться в ответ.",
    "Ты делаешь меня лучше, просто будучи собой. Я безумно тебя люблю.",

  const heartsBox = document.getElementById("hearts");
  const emojis = ["❤️","💖","💗","💕","💘","🌸","✨"];
  let heartsTimer = null;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function spawnHeart(burst=false){
    if(reduceMotion) return;
    const el = document.createElement("span");
    el.className = "fall";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const dur = burst ? 3 + Math.random()*2 : 6 + Math.random()*6;
    el.style.left = Math.random()*100 + "vw";
    el.style.fontSize = (14 + Math.random()*26) + "px";
    el.style.opacity = .4 + Math.random()*.6;
    el.style.animationDuration = dur + "s";
    el.style.setProperty("--dx", (Math.random()*160-80) + "px");
    el.style.setProperty("--rot", (Math.random()*540-270) + "deg");
    heartsBox.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+200);
  }
  function startHearts(){ if(!heartsTimer) heartsTimer = setInterval(spawnHeart, 700); }

  const pass = document.getElementById("pass");
  const err = document.getElementById("err");
  const card = document.getElementById("loginCard");

  function tryLogin(){
    if(pass.value === PASSWORD){
      err.classList.remove("show");
      document.getElementById("login").classList.add("hidden");
      document.getElementById("surprise").classList.remove("hidden");
      startHearts();
      for(let i=0;i<10;i++) setTimeout(()=>spawnHeart(true), i*90);
      showPhrase(0, true);
    } else {
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      err.classList.add("show");
      pass.value = "";
      pass.focus();
    }
  }
  document.getElementById("enter").addEventListener("click", tryLogin);
  pass.addEventListener("keydown", e => { if(e.key==="Enter") tryLogin(); });
  pass.addEventListener("input", () => err.classList.remove("show"));

  // Генератор бесконечных признаний
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const G = {
    addr:["Фатима","Моя любимая","Солнышко","Моя родная","Любимая","Моя радость"],

  const templates = [
    () => pick(G.addr)+", ты — "+pick(G.meta)+".",

    () => pick(G.addr)+", "+pick(G.feel)+" "+pick(G.amount)+"."
  ];
  const genPhrase = () => pick(templates)() + pick(G.close);
  const recent = [];
  let shown = 0;
  function nextPhrase(){
    let s, tries = 0;
    do{
      s = Math.random() < 0.3 ? pick(phrases) : genPhrase();
      tries++;
    } while(recent.includes(s) && tries < 40);
    recent.push(s);
    if(recent.length > 80) recent.shift();
    return s;
  }

  const phraseEl = document.getElementById("phrase");
  const counter = document.getElementById("counter");
  let idx = 0;
  function showPhrase(i, first=false){
    const apply = () => {
      phraseEl.textContent = nextPhrase();
      shown++; counter.textContent = "Признание № " + shown + " · их бесконечно ∞";
      phraseEl.classList.remove("out");
    };
    if(first){ apply(); return; }
    phraseEl.classList.add("out");
    setTimeout(apply, 350);
  }
  document.getElementById("next").addEventListener("click", () => {
    idx++;
    showPhrase(idx);
    for(let i=0;i<4;i++) setTimeout(()=>spawnHeart(true), i*80);
  });
  const boomLabels = ["Ещё раз! 💖","Люблю тебя! 😘","Ты моя радость ✨","Мур-мур 🥰","Ещё-ещё! 💘"];
  let boomCount = 0;
  function burst(x, y){
    if(reduceMotion) return;
    const parts = ["❤️","💖","💗","💕","💘","✨","🌸"];
    for(let i=0;i<12;i++){
      const el = document.createElement("span");
      el.className = "pop";
      el.textContent = parts[Math.floor(Math.random()*parts.length)];
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.fontSize = (16 + Math.random()*24) + "px";
      document.body.appendChild(el);
      const ang = Math.random()*Math.PI*2;
      const dist = 90 + Math.random()*170;
      const dx = Math.cos(ang)*dist;
      const dy = Math.sin(ang)*dist - 60;
      const rot = (Math.random()*360-180);
      const anim = el.animate([
        {transform:"translate(-50%,-50%) scale(.2) rotate(0deg)",opacity:1},
        {transform:"translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(1.1) rotate(" + rot + "deg)",opacity:1,offset:.7},
        {transform:"translate(calc(-50% + " + dx + "px), calc(-50% + " + (dy+80) + "px)) scale(.9) rotate(" + rot + "deg)",opacity:0}
      ],{duration:1100 + Math.random()*700,easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"});
      anim.onfinish = () => el.remove();
    }
  }
  document.getElementById("boom").addEventListener("click", function(e){
    const r = this.getBoundingClientRect();
    const x = (e.clientX || r.left + r.width/2);
    const y = (e.clientY || r.top + r.height/2);
    burst(x, y);
    for(let i=0;i<8;i++) setTimeout(()=>spawnHeart(true), i*80);
    this.textContent = boomLabels[boomCount % boomLabels.length];
    boomCount++;
    try{ if(navigator.vibrate) navigator.vibrate(60); }catch(err){}
  });
  document.getElementById("bigHeart").addEventListener("click", () => {
    for(let i=0;i<8;i++) setTimeout(()=>spawnHeart(true), i*70);
  });
</script>
</body>
</html>
